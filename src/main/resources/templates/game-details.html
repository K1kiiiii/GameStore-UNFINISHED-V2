<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${game.title} + ' - Game Store'">Game Details</title>
    <style>
        /* Header layout (shared) */
        .site-header { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:#0f1720; color:#c7d5e0; }
        .header-left, .header-center, .header-right { display:flex; align-items:center; }
        .header-left { gap:10px; }
        .site-logo { height:36px; width:auto; display:inline-block; }
        .nav-btn.small { padding:8px 12px; font-size:14px; }
        .search-form { width:420px; }
        .search-input { width:100%; padding:8px 10px; border-radius:6px; border:1px solid #213445; background:#12202b; color:#c7d5e0; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1b2838;
            color: #c7d5e0;
        }

        .top-nav {
            background-color: #171a21;
            padding: 15px 20px;
            display:flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-nav h1 {
            margin: 0;
            font-size: 24px;
            color: #66c0f4;
        }
        .nav-links a {
            margin-left: 15px;
            text-decoration: none;
            color: #c7d5e0;
            font-weight: bold;
        }
        .nav-links a:hover {
            color: #fff;
        }

        .container {
            display: flex;
            padding: 30px 50px;
            gap: 40px;
        }

        .game-image {
            width: 400px;
            height: 225px;
            object-fit: cover;
            border-radius: 6px;
        }

        .game-info {
            max-width: 600px;
        }

        .game-info h2 {
            font-size: 32px;
            margin: 0 0 10px;
            color: #66c0f4;
        }

        .game-info p {
            font-size: 16px;
            margin: 6px 0;
        }

        .price {
            font-weight: bold;
            font-size: 20px;
            color: #a4d007;
            margin: 12px 0;
        }

        .buy-btn {
            display:inline-block;
            padding: 10px 18px;
            background:#66c0f4;
            color:black;
            font-weight:bold;
            border-radius:4px;
            text-decoration:none;
            cursor:pointer;
        }
        .buy-btn:hover { background:#fff; }

        /* Reviews section */
        .reviews {
            margin-top: 20px;
            max-width: 1000px;
            padding: 0 50px 50px 50px;
        }
        .review {
            background: #0f1720;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .review .meta {
            font-size: 12px;
            color: #9fb6c9;
            margin-bottom: 6px;
        }
        .review-form {
            margin-top: 12px;
            display:flex;
            gap:10px;
            align-items:flex-start;
        }
        .review-form input, .review-form textarea, .review-form select {
            background:#12202b;
            border:1px solid #213445;
            color: #c7d5e0;
            padding:8px;
            border-radius:4px;
        }
        .review-form textarea { width: 420px; height:80px; }
        .review-form button { background:#66c0f4; color:black; padding:8px 12px; border-radius:4px; border:none; font-weight:bold; }

        /* Modal styles */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: #0f1720;
            color: #c7d5e0;
            border-radius: 8px;
            padding: 20px;
            width: 420px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .modal h3 {
            margin-top: 0;
            color: #66c0f4;
        }
        .modal label { display:block; margin-top:8px; font-size:13px; color:#9fb6c9; }
        .modal input, .modal select { width:100%; padding:8px; margin-top:6px; border-radius:4px; border:1px solid #213445; background:#12202b; color:#c7d5e0; }
        .modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
        .modal .btn { padding:8px 12px; border-radius:4px; border:none; cursor:pointer; font-weight:bold; }
        .modal .btn.primary { background:#66c0f4; color:black; }
        .modal .btn.ghost { background:transparent; color:#c7d5e0; border:1px solid #2b3b4a; }
        .modal .success { background:#0b3; color:black; padding:8px; border-radius:4px; text-align:center; }

    </style>
</head>
<body>

<!-- Header with logo -->
<header class="site-header">
    <div class="header-left">
        <a href="/games" class="nav-btn small">Browse Games</a>
        <a href="/"><img src="/images/image_2026-01-14_104444945-removebg-preview.png" alt="Logo" class="site-logo"/></a>
    </div>

    <div class="header-center"></div>

    <div class="header-right">
        <div th:if="${!authenticated}">
            <a href="/login" class="nav-btn">Login</a>
        </div>
        <div th:if="${authenticated}">
            <form th:action="@{/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="nav-btn">Logout</button>
            </form>
        </div>
    </div>
</header>

<!-- Main Game Details -->
<div class="container">
    <!-- Game Image -->
    <img th:src="@{'/images/' + ${game.image}}" class="game-image" alt="Game Image">

    <!-- Game Info -->
    <div class="game-info">
        <h2 th:text="${game.title}">Game Title</h2>
        <p><strong>Genre:</strong> <span th:text="${game.genre}">Genre</span></p>
        <p><strong>Developer:</strong> <span th:text="${game.developer}">Developer</span></p>
        <p class="price" th:text="${game.price} + '€'">29.99€</p>

        <p th:if="${game.reviews != null and !#lists.isEmpty(game.reviews)}">
            Average Rating: <span th:text="${avgRating}">0</span>/5
        </p>

        <a href="#" id="buy-now-btn" class="buy-btn">Buy Now</a>
    </div>
</div>

<!-- Payment Modal (hidden by default) -->
<div id="payment-modal" class="modal-backdrop" role="dialog" aria-hidden="true">
    <div class="modal" role="document" aria-labelledby="payment-title">
        <h3 id="payment-title">Complete purchase</h3>
        <p th:text="'Buying: ' + ${game.title}">Buying: Game</p>

        <form id="payment-form" onsubmit="return false;">
            <label for="card-name">Name on card</label>
            <input id="card-name" type="text" placeholder="Full name" required />

            <label for="card-number">Card number</label>
            <input id="card-number" type="text" placeholder="1234 5678 9012 3456" required />

            <div style="display:flex; gap:8px;">
                <div style="flex:1;">
                    <label for="expiry">Expiry</label>
                    <input id="expiry" type="text" placeholder="MM/YY" required />
                </div>
                <div style="width:120px;">
                    <label for="cvv">CVV</label>
                    <input id="cvv" type="text" placeholder="123" required />
                </div>
            </div>

            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" />

            <div class="actions">
                <button type="button" class="btn ghost" id="cancel-payment">Cancel</button>
                <button type="submit" class="btn primary" id="submit-payment">Pay <span th:text="${game.price} + '€'">29.99€</span></button>
            </div>

            <div id="payment-result" style="margin-top:12px; display:none;"></div>
        </form>
    </div>
</div>

<!-- Reviews -->
<div class="reviews">
    <h3>Reviews</h3>

    <div th:if="${reviews == null or #lists.isEmpty(reviews)}">
        <p>No reviews yet. Be the first to review!</p>
    </div>

    <div th:each="rev : ${reviews}" class="review">
        <div class="meta">
            <strong th:text="${rev.author}">Author</strong>
            &nbsp;&#183;&nbsp;
            <span th:text="${rev.rating} + '/5'">5/5</span>
        </div>
        <div class="content" th:text="${rev.content}">Review content</div>
    </div>

</div>

<script>
    // Modal open/close logic and fake payment submission
    (function() {
        const buyBtn = document.getElementById('buy-now-btn');
        const modal = document.getElementById('payment-modal');
        const cancelBtn = document.getElementById('cancel-payment');
        const form = document.getElementById('payment-form');
        const result = document.getElementById('payment-result');

        function openModal() {
            modal.style.display = 'flex';
            modal.setAttribute('aria-hidden', 'false');
        }
        function closeModal() {
            modal.style.display = 'none';
            modal.setAttribute('aria-hidden', 'true');
            result.style.display = 'none';
            result.innerHTML = '';
            form.querySelectorAll('input').forEach(i => i.value = '');
        }

        buyBtn && buyBtn.addEventListener('click', function(e) {
            e.preventDefault();
            openModal();
        });
        cancelBtn && cancelBtn.addEventListener('click', function() { closeModal(); });

        // Fake submit - client-side only, no server call
        form && form.addEventListener('submit', function(e) {
            e.preventDefault();
            // minimal validation for UX
            const name = document.getElementById('card-name').value.trim();
            const number = document.getElementById('card-number').value.trim();
            const exp = document.getElementById('expiry').value.trim();
            const cvv = document.getElementById('cvv').value.trim();
            if (!name || !number || !exp || !cvv) {
                result.style.display = 'block';
                result.style.color = 'orange';
                result.textContent = 'Please complete all required fields (this is a demo).';
                return;
            }

            // Simulate processing
            result.style.display = 'block';
            result.style.color = '#0b3';
            result.textContent = 'Processing payment...';

            setTimeout(function() {
                result.style.color = 'white';
                result.innerHTML = '<div class="success">Payment successful! Thank you for your purchase.</div>';
                // auto-close after a short delay
                setTimeout(closeModal, 2000);
            }, 1000);
        });

        // Close modal when clicking outside modal content
        modal && modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

    })();
</script>

</body>
</html>
